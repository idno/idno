name: Tests

on:
  pull_request:
    branches: ['*']
  push:
    branches: [dev, stable]

jobs:
  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-mongodb

      - name: Run phpcs
        run: vendor/bin/phpcs -n

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / ${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        db: [mysql, mongo]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: known_unittest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: >-
            curl, dom, gd, json, libxml, mbstring, pdo, pdo_mysql,
            session, simplexml, openssl, gettext, mongodb
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install MongoDB library
        if: matrix.db == 'mongo'
        run: composer require mongodb/mongodb --no-interaction

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Configure MySQL database
        if: matrix.db == 'mysql'
        run: |
          mysql -h 127.0.0.1 -uroot -e "GRANT ALL ON known_unittest.* TO 'root'@'%';"
          mysql -h 127.0.0.1 -uroot known_unittest < warmup/schemas/mysql/mysql.sql
          cp Tests/build/config_mysql.ini configuration/config.ini
          sed -i "s/dbuser = 'travis'/dbuser = 'root'/" configuration/config.ini
          sed -i "s/dbhost = 'localhost'/dbhost = '127.0.0.1'/" configuration/config.ini

      - name: Configure MongoDB
        if: matrix.db == 'mongo'
        run: |
          cp Tests/build/config_default.ini configuration/config.ini

      - name: Start web server
        run: |
          # Serve the checkout with PHP's built-in web server, using the same PHP
          # binary as the tests. This avoids depending on which mod_php packages
          # the runner's Ubuntu release happens to ship.

          # The tests expect the site on port 80; let the runner user bind it
          sudo systemctl stop apache2 2>/dev/null || true
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80

          PHP_CLI_SERVER_WORKERS=8 nohup php -S 0.0.0.0:80 -t "${{ github.workspace }}" \
            "${{ github.workspace }}/Tests/build/router.php" \
            > "${{ github.workspace }}/php-server.log" 2>&1 &

          # Wait for the server to accept connections
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost/; then
              echo "Web server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Web server did not start"
          cat "${{ github.workspace }}/php-server.log"
          exit 1

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Show web server log on failure
        if: failure()
        run: tail -n 200 ${{ github.workspace }}/php-server.log 2>/dev/null || true
