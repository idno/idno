<body class="account-template">

<span>Settings</span>

<a href="{site}/account/settings/tools/"
       class="idno-account-nav-item active">
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
<span>Tools & Apps</span>
</a>
<a href="{site}/account/indiepub/"
   class="idno-account-nav-item">
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
<span>IndiePub</span>
</a>
<a href="{site}/account/bridgy/"
   class="idno-account-nav-item">
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
<span>Interactions</span>
</a>
<a href="{site}/account/export/"
       class="idno-account-nav-item">

<span>Export Data</span>
</a>
</div>
<div class="idno-account-back">
<a href="{site}/" class="idno-account-nav-item">
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
<span>Back to site</span>
</a>
</div>
</nav>
<main class="idno-account-main">
<div class="idno-account-content">
<div id="page-messages">
</div>
<h1 class="idno-admin-page-title">
    Tools and Apps</h1>
<div class="idno-admin-card">
<h2>Bookmarklet</h2>
<p>
        The Idno bookmarklet is the best way to save links, reply to posts, and share articles.    </p>
<p>
        Just drag the bookmarklet button below into your browser's Bookmark Bar.    </p>
<p>
<p style="padding-top: 15px; padding-bottom: 15px;"><a class="bookmarklet" href="javascript:(function(){window.open('{site}/share?share_url='+encodeURIComponent(location.href)+'&share_title\='+encodeURIComponent(document.title));})();" class="btn">Fixture Site</a>
</p>
</p>
</div>
<div class="idno-admin-card" style="margin-top: 1.5rem;">
<h2>API</h2>
<div class="idno-form-group">
<label>Your API key</label>
<form id="apikey_form"><span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/account/settings/tools/" />
<input type="text" id="apikey" class="idno-input" name="apikey" value="Click to show" readonly>
</form>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var input = document.getElementById('apikey');
        if (!input) return;
        input.addEventListener('click', function() {
            var form = document.getElementById('apikey_form');
            var params = new URLSearchParams(new FormData(form)).toString();
            fetch('{site}/account/settings/tools/?' + params, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                input.value = data;
            });
        });
    });
</script>
</div>
</main>
</div>
<script src="{site}/js/idno-2026.min.js" defer></script>
<script src="{site}/vendor/npm-asset/exif-js/exif.js"></script>
</body>
</html>
