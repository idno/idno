        $(document).ready(function () {
            makeRich('#body');
        })
        ;

        function makeRich(container) {
            $(container).tinymce({
                selector: 'textarea',
                theme: 'modern',
                skin: 'light',
                statusbar: false,
                menubar: false,
                toolbar: 'styleselect | bold italic | link image | blockquote bullist numlist | alignleft aligncenter alignright | code',
                plugins: 'code link image autoresize',
                relative_urls: false,
                remove_script_host: false,
                convert_urls: true,
                file_picker_callback: function (callback, value, meta) {
                    filePickerDialog(callback, value, meta);
                }
            });
        }

        function filePickerDialog(callback, value, meta) {
            tinymce.activeEditor.windowManager.open({
                title: 'File Manager',
                url: '{site}\/filepicker\/\u003Ftype\u003D' + meta.filetype,
                width: 650,
                height: 550
            }, {
                oninsert: function (url) {
                    callback(url);
                }
            });
        }

    </script>

    /* Handle submit button */
    $(document).ready(function() {
        $('div.page-body form').submit(function() {
            
            var richrequiredcomplete = true;
            
            $(this).find('textarea.validation-required').each(function(){
                if ($(this).val().length == 0) {
                    richrequiredcomplete = false;
                }
            });
            
            
            // Fudge rich text completion for now.
            if (richrequiredcomplete == true) {
                    $('input[type=submit]').attr('disabled', 'yes').hide(); //val('Saving...').removeClass('btn-primary').addClass('btn-link');
                //$('input[type=submit]').attr('disabled', 'yes').val('Saving...').removeClass('btn-primary').addClass('btn-link');
                $('.btn-cancel').hide();
                $('#submit-spinner').show();
            }
        });
    });
