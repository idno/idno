
<div class="form-list">
<div class="row">
<div class="col-sm-12 col-md-2">
<label>
Title
</label>
</div>
<div class="col-sm-12 col-md-6">
<input
type="text" name="title" id="form-list-element-title" required     class="idno-input input-text"
placeholder="Say &quot;it&quot;"     value="Default title"
    />
</div>
<div class="col-sm-12 col-md-4">
</div>
</div>
<div class="row">
<div class="col-sm-12 col-md-2">
<label>
Email address
</label>
</div>
<div class="col-sm-12 col-md-6">
<input
type="email" name="email" id="form-list-element-email" required     class="idno-input input-email"
    value="ada@example.com"
    />
</div>
<div class="col-sm-12 col-md-4">
<p class="config-desc">We will not &lt;share&gt; it</p>
</div>
</div>
<input
type="hidden" name="secret" id="form-list-element-secret" required     class="idno-input input-hidden"
    value="x"
    />
</div>
