<form action="{site}/event/edit/" method="post">
<div class="idno-editor">
<h4 class="idno-editor-heading">
New Event
</h4>
<div class="idno-form-field">
<label class="idno-label" for="title">
Event name</label>
<input
type="text" name="title" id="title"     class="idno-input idno-input"
placeholder="Give it a name"     value=""
    />
</div>
<div style="display:flex;gap:var(--spacing-gap);flex-wrap:wrap">
<div style="flex:1;min-width:200px">
<div class="idno-form-field">
<label class="idno-label" for="location">
Location</label>
<input
type="text" name="location" id="location"     class="idno-input idno-input"
placeholder="Where will it take place?"     value=""
    />
</div>
<div class="idno-form-field">
<label class="idno-label" for="starttime">
Start day and time</label>
<input
type="datetime-local" name="starttime" id="starttime"     class="idno-input idno-input"
placeholder="Type in the start day and time?"     value=""
    />
</div>
<div class="idno-form-field">
<label class="idno-label" for="endtime">
End day and time</label>
<input
type="datetime-local" name="endtime" id="endtime"     class="idno-input idno-input"
placeholder="Type in the end day and time"     value=""
    />
</div>
