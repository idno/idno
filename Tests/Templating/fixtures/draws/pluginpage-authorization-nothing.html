<div class="row">
<div class="span6 offset3 well text-center">
<h2 class="text-center">
Authenticate
</h2>
<form action="{site}/indieauth/approve" method="post">
<p>
You are logged in as ada.
</p>
<p>
Authenticate to ?
</p>
<div class="control-group">
<div class="controls">
<button type="submit" class="btn btn-primary">
Authenticate
</button>
<a class="btn btn-cancel"
                       href="">Cancel</a>
</div>
</div>
<input type="hidden" name="me" value="" /><input type="hidden" name="client_id" value="" /><input type="hidden" name="redirect_uri" value="" /><input type="hidden" name="scope" value="" /><input type="hidden" name="state" value="" /><input type="hidden" name="code_challenge" value="" /><input type="hidden" name="code_challenge_method" value="" />
<span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/indiepub/auth" />
</form>
</div>
</div>
