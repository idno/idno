<div class="row">
<div class="col-md-8 col-md-offset-2">
<h1>
Reset your password
</h1>
<p>
Forgot your password? Don&#039;t worry! It happens to the best of us.</p>
<p>Just enter the email address associated with your Fixture Site account below, and we&#039;ll send you a top secret link to your email account so that you can create a new password.
</p>
<form action="{site}/account/password" method="post">
<div class="row">
<div class="form-group col-md-6">
<label class="control-label" for="inputName">Your email address</label>
<!--<small>The address associated with your Fixture Site account.</small>-->
<input type="email" id="inputName" placeholder="me@awesome.com" class="form-control" name="email" value="" required>
</div>
</div>
<!-- Captcha control -->
<div class="row">
<div class="form-group col-md-6">
<div class="controls">
<button type="submit" class="btn btn-primary">Send password reset email</button>
<span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/account/password" />
</div>
</div>
</div>
</form>
</div>
</div>
