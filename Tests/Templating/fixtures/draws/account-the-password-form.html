<div class="idno-gate">
<div class="idno-editor">
<h1 class="idno-editor-heading">Reset your password</h1>
<p class="idno-gate-lead">Enter the email address of your Fixture Site account, and we will send you a link to choose a new password.</p>
<form action="{site}/account/password" method="post">
<div class="idno-form-field">
<label class="idno-label" for="reset-email">Your email address</label>
<input type="email" id="reset-email" name="email" class="idno-input" required autofocus
                       autocomplete="email" autocapitalize="off" placeholder="you@example.com">
</div>
<!-- Captcha control -->
<div class="idno-gate-actions">
<button type="submit" class="idno-btn idno-btn-primary">Send password reset email</button>
</div>
<span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/account/password" />
</form>
<p class="idno-gate-foot">
<a href="{site}/session/login">Back to sign in</a>
</p>
</div>
</div>
