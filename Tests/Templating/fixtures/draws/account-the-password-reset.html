<div class="idno-gate">
<div class="idno-editor">
<h1 class="idno-editor-heading">Choose a new password</h1>
<form action="{site}/account/password/reset" method="post">
<div class="idno-form-field">
<label class="idno-label" for="reset-email">Your email address</label>
<input type="email" id="reset-email" name="email" class="idno-input" readonly required autocomplete="username"
                       value="ada@example.com">
</div>
<div class="idno-form-field">
<label class="idno-label" for="reset-password">New password</label>
<input type="password" id="reset-password" name="password" class="idno-input" required minlength="7" autofocus
                       autocomplete="new-password" aria-describedby="reset-password-help">
<p class="idno-form-help" id="reset-password-help">At least 7 characters.</p>
</div>
<div class="idno-form-field">
<label class="idno-label" for="reset-password2">Your new password again</label>
<input type="password" id="reset-password2" name="password2" class="idno-input" required minlength="7"
                       autocomplete="new-password">
</div>
<div class="idno-gate-actions">
<button type="submit" class="idno-btn idno-btn-primary">Save new password</button>
</div>
<input type="hidden" name="code" value="0123456789abcdef">
<span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/account/password/reset" />
</form>
</div>
</div>
