</div><form action="{site}/filepicker/" method="post"
      enctype="multipart/form-data">
<div class="row file-picker">
<div class="col-md-10 col-md-offset-1">
<div style="text-align: center">
<h2>
Upload an image
</h2>
<div id="photo-preview" style="display: inline-block; margin-top: 1em; margin-bottom: 1em">
<div style="width: 300px; height: 200px; background-color: #ccc;">&nbsp;</div>
</div>
</div>
<div class="col-md-10 col-md-offset-1" style="text-align: center">
<label>
<div id="photo-preview" ></div>
<span class="btn btn-primary btn-file">
<i class="fa fa-camera"></i>
<span
                                                id="photo-filename">Select an image</span>
<input type="file" name="file" id="photo"
                                                   class="form-control col-md-9"
                                                   accept="image/*"
                                                   onchange="photoPreview(this)"/>
</span>
</label>
<p>
<span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/filepicker/" />
<input type="submit" value="Upload this image" class="btn btn-primary" style="display:none"
                           id="upload-button">
</p>
</div>
</div>
</div>
</form>
<script>
    function photoPreview(input) {
        if (!input.files || !input.files[0]) {
            return;
        }
        var reader = new FileReader();
        reader.onload = function (e) {
            var image = document.createElement('img');
            image.id = 'photopreview';
            image.style.height = '200px';
            image.src = e.target.result;
            document.getElementById('photo-preview').replaceChildren(image);
            document.getElementById('photo-filename').textContent = 'Choose\u0020a\u0020different\u0020image';
            document.getElementById('upload-button').style.display = '';
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
