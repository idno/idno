<div class="row">
<div class="col-md-8 col-md-offset-2">
<h3 class="register">
Hello there!
</h3>
<h4 class="register">Create a new account to get started.</h4>
<div class="jumbotron">
<p>
</p>
<form action="{site}/account/register" method="post" style="width: 100%" class="form-horizontal">
<div class="control-group">
<label class="control-label" for="inputUsername">Your name</label>
<div class="controls">
<input type="text" id="inputName" placeholder="Henri Matisse" class="" style="width: 100%" name="name" value="">
</div>
</div>
<div class="control-group">
<label class="control-label" for="inputUsername">Choose a handle
<br /><small>Handles identify you throughout the site. Something simple is best: for example,
<em>janedoe</em>.</small></label>
<div class="controls">
<input type="text" id="inputUsername" placeholder="username" class="" style="width: 100%" name="handle" value="" autocapitalize="off" autocorrect="off" spellcheck="false">
</div>
</div>
<div class="control-group">
<label class="control-label" for="inputEmail">Your email address</label>
<div class="controls">
<input type="email" id="inputEmail" placeholder="you@email.com" class="" style="width: 100%" name="email" value="new@example.com" autocapitalize="off">
</div>
</div>
<div class="control-group">
<label class="control-label" for="inputEmail">Create a password
<br /><small>At least 7 characters please.</small></label>
<div class="controls">
<input type="password" id="inputPassword" placeholder="secret-password" class="" style="width: 100%" name="password" >
</div>
</div>
<div class="control-group">
<label class="control-label" for="inputEmail">Your password again</label>
<div class="controls">
<input type="password" id="inputPassword" placeholder="secret-password" class="" style="width: 100%" name="password2">
</div>
</div>
<div class="control-group">
<div class="controls">
<button type="submit" class="btn btn-reg">Create Account</button>
<input type="hidden" name="code" value="abc">
</div>
</div>
<!-- Captcha control -->
<span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/account/register" />
</form>
</div>
</div>
</div>
