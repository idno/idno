<div id="form-main">
<div id="form-div">
<h2 class="profile">Create your profile</h2>
<form action="{site}/profile/ada" method="post" enctype="multipart/form-data">
<p class="profile-pic" id="photo-preview">
<img src="{site}/gfx/users/default-04.png" alt="" style="width: 150px; cursor: pointer"
                     class="icon-container" onclick="$('#photo').click();"/>
</p>
<div class="upload">
<span class="camera btn-file" type="button" value="Add a photo of yourself">
<span id="photo-filename">Add a photo of yourself</span>
<input type="file" name="avatar" id="photo" class="col-md-9" accept="image/*" capture="camera"
                           onchange="photoPreview(this)"/>
</span>
</div>
<p class="name">
<label class="control-label" for="inputName">Your name
<br/></label>
<input name="name" type="text" class="profile-input" placeholder="Ben Franklin" id="name"/>
</p>
<p class="text">
<label class="control-label" for="inputName">Your short bio<br/></label>
<textarea name="profile[description]" class="profile-input" id="description"
                          placeholder="I fly kites..."></textarea>
</p>
<p class="website">
<span id="websites">
<label class="control-label" for="inputWebsite">Your other websites
<small>(a blog, a portfolio, Twitter, Facebook, etc)</small>
<br/></label>
<input name="profile[url][]" type="url" class="profile-input" id="website"
                           placeholder="https://..."/>
</span>
<a href="#" onclick="$('#websites').append($('#website-template').html()); return false;">Add another website</a>
</p>
<div class="col-md-12">
<div class="submit">
<span class="known-security-token" style="display: none;" id="tid{id}"></span>
<input type="hidden" name="__bTs" value="{token-time}" />
<input type="hidden" name="__bTk" value="{token}" />
<input type="hidden" name="__bTa" value="/profile/ada" />
<input type="submit" value="Save profile" class="btn btn-primary btn-lg btn-responsive">
<input type="hidden" name="onboarding" value="1"/>
</div>
</form>
<div id="website-template" style="display:none"><input name="profile[url][]" type="url" class="profile-input"
                                                               id="website" placeholder="https://..."/></div>
</div>
</div>
</div>
<script>
    //if (typeof photoPreview !== function) {
    function photoPreview(input) {

        if (input.files && input.files[0]) {
            var reader = new FileReader();

            reader.onload = function (e) {
                $('#photo-preview').html('<img src="" id="photopreview" style="display:none; width: 150px">');
                $('#photo-filename').html('Choose\u0020different\u0020photo');
                $('#photopreview').attr('src', e.target.result);
                $('#photopreview').show();
            }

            reader.readAsDataURL(input.files[0]);
        }
    }
    //}
</script>
