database = 'mongo'
dbname = 'known_unittest';
; PHPUnit builds http://localhost/ (IDNO_DOMAIN and IDNO_PORT unset); the web server must agree.
url = 'http://localhost/'
sessionname = 'known_unittest';

; The same plugins as the local test rig (Tests/rig/config.ini), so CI tests the same site.
alwaysplugins[] = 'Status'
alwaysplugins[] = 'Text'
alwaysplugins[] = 'Photo'
alwaysplugins[] = 'Like'
alwaysplugins[] = 'Checkin'
alwaysplugins[] = 'Media'
alwaysplugins[] = 'Event'
alwaysplugins[] = 'Bridgy'
alwaysplugins[] = 'IndiePub'
alwaysplugins[] = 'ActivityPub'
alwaysplugins[] = 'StaticPages'
alwaysplugins[] = 'Webhooks'


pedantic_mode = true;
debug = true;