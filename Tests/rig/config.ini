; Idno configuration for the local test rig (see Tests/rig/up.sh).
; __UPLOADPATH__ is replaced by up.sh with a directory under sys_get_temp_dir().
database = 'MySQL'
dbname = 'known_unittest'
dbpass = ''
dbuser = 'root'
dbhost = '127.0.0.1'
dbport = 33306

url = 'http://127.0.0.1:8089/'
sessionname = 'known_unittest'

filesystem = 'local'
uploadpath = '__UPLOADPATH__'

alwaysplugins[] = 'Status'
alwaysplugins[] = 'Text'
alwaysplugins[] = 'Photo'
alwaysplugins[] = 'Like'
alwaysplugins[] = 'Checkin'
alwaysplugins[] = 'Media'
alwaysplugins[] = 'Event'
alwaysplugins[] = 'Bridgy'
alwaysplugins[] = 'IndiePub'
alwaysplugins[] = 'ActivityPub'
alwaysplugins[] = 'StaticPages'
alwaysplugins[] = 'Webhooks'

pedantic_mode = true
debug = true
